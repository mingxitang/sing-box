name: Build Android eBPF

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag (leave blank to build this branch)'
        type: string
  workflow_call:
    inputs:
      upstream_tag:
        type: string
        required: true
      release_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 default + eBPF
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    concurrency:
      group: android-ebpf-package
      queue: max
    steps:
      - name: Choose package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="${UPSTREAM_TAG:-v1.15.0-alpha.13}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|preview|dev)(\.[0-9]+)?)?)([-+]|$) ]]; then
            echo "::error::Cannot derive a version from tag $tag"
            exit 1
          fi
          base="${BASH_REMATCH[1]}+$(TZ=Asia/Shanghai date +%Y%m%d)"
          version="$base"
          for ((sequence = 2; ; sequence++)); do
            package="sing-box-${version}-android-arm64-v8a-ebpf.tar.gz"
            count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
              -f "name=$package" --jq '.total_count')
            if [[ "$count" == 0 ]]; then
              break
            fi
            version="${base}.${sequence}"
          done
          printf 'version=%s\npackage=%s\n' "$version" "$package" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout upstream release
        if: inputs.upstream_tag != ''
        uses: actions/checkout@v6
        with:
          repository: MiChongs/sing-box
          ref: refs/tags/${{ inputs.upstream_tag }}
          path: upstream
          persist-credentials: false

      - name: Apply Smart crash fix
        if: inputs.upstream_tag != ''
        working-directory: upstream
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_TAG" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]
          patch="$GITHUB_WORKSPACE/.github/patches/smart-disjoint-pool.patch"
          if git apply --check --reverse --index "$patch"; then
            echo 'Upstream already contains the patch and regression test.'
          else
            git apply --index "$patch"
          fi
          printf 'Upstream tag `%s` at `%s`\n' "$UPSTREAM_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache-dependency-path: ${{ inputs.upstream_tag && 'upstream/go.sum' || 'go.sum' }}

      - name: Test Smart selection
        working-directory: ${{ inputs.upstream_tag && 'upstream' || '.' }}
        run: go test -race ./common/smart

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build default Android configuration plus eBPF
        working-directory: ${{ inputs.upstream_tag && 'upstream' || '.' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail
          go run ./cmd/internal/build_libbox -target android-bin -platform android/arm64 \
            -version "$VERSION" -tags with_ebpf
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all sing-box-android-arm64-v8a
          ls -lh sing-box-android-arm64-v8a
          mkdir -p dist
          install -m 755 sing-box-android-arm64-v8a "$RUNNER_TEMP/sing-box"
          tar -czf "dist/$PACKAGE" -C "$RUNNER_TEMP" sing-box

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ format('{0}dist/{1}', inputs.upstream_tag && 'upstream/' || '', steps.version.outputs.package) }}
          archive: false
          if-no-files-found: error

  record:
    name: Record successful upstream build
    if: inputs.release_id != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark release as built
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/android-ebpf-built/$RELEASE_ID" -f "sha=$GITHUB_SHA"
