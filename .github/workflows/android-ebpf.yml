name: Build Android eBPF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 default + eBPF
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1

      - name: Test Smart selection
        run: go test -race ./common/smart

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build default Android configuration plus eBPF
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          VERSION="1.15.0-alpha.13-smartfix.${GITHUB_SHA::8}"
          go run ./cmd/internal/build_libbox -target android-bin -platform android/arm64 \
            -version "$VERSION" -tags with_ebpf
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all sing-box-android-arm64-v8a
          ls -lh sing-box-android-arm64-v8a
          mkdir -p dist
          cp sing-box-android-arm64-v8a dist/sing-box
          cd dist
          tar -czf "sing-box-${VERSION}-android-arm64-v8a-ebpf.tar.gz" sing-box
          rm sing-box
          sha256sum *.tar.gz > SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-arm64-v8a-default-ebpf
          path: dist/
          if-no-files-found: error
